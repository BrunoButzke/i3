services:
  db:
    image: postgres:16-alpine
    container_name: i3-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: i3database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-i3244466666}
      POSTGRES_DB: i3
    volumes:
      - i3_postgres_data:/var/lib/postgresql/data
    # Postgres só na rede interna (evita conflito com 5432 no host).
    # Para expor no host, descomente e ajuste a porta:
    # ports:
    #   - "${POSTGRES_PORT:-5434}:5432"
    networks:
      - i3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U i3database -d i3 -h localhost"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: i3-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://i3database:${POSTGRES_PASSWORD:-i3244466666}@db:5432/i3?schema=public
      APPSCRIPT_DATA_PATH: /data/appScript
      NODE_ENV: development
      RUN_DB_IMPORT: ${RUN_DB_IMPORT:-false}
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ../appScript:/data/appScript:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - i3
    entrypoint: ["/app/scripts/docker-entrypoint.sh"]
    command: ["npm", "run", "dev"]

networks:
  i3:
    name: i3_network

volumes:
  i3_postgres_data:
  node_modules:
